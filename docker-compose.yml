# Local development services. Start with: npm run db:up
name: offers

services:
  db:
    image: postgres:18
    container_name: offers-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: offers
      POSTGRES_PASSWORD: offers
      POSTGRES_DB: offers
    ports:
      # 5433 on the host so it doesn't clash with a local Postgres on 5432
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U offers -d offers']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
